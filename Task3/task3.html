
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../Task0/task0.html">Task 0</a></li>
            <li><a href="../Task1/task1.html">Task 1</a></li>
            <li><a href="../Task2/task2.html">Task 2</a></li>
            <li><a href="../Task3/task3.html">Task 3</a></li>
            <li><a href="../Task4/task4.html">Task 4</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Contact Form</h1>

        <form id="contactForm" class="row g-3 w-100" novalidate>

            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control"
                       id="name" name="name"
                       placeholder="Enter your name"
                       required minlength="2" maxlength="30">

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">
                    Name must contain at least 2 characters.
                </div>
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control"
                       id="email" name="email"
                       placeholder="name@example.com" required>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control"
                          id="message" name="message"
                          rows="4"
                          placeholder="Enter your message"
                          required minlength="10"
                          maxlength="500"></textarea>

                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">
                    Message must contain at least 10 characters.
                </div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">
                    Submit
                </button>
            </div>

        </form>
    </main>

    <script>
        const form = document.getElementById("contactForm");
        const inputs = form.querySelectorAll("input, textarea");

        function validateInput(input) {
            input.classList.remove("is-valid", "is-invalid");

            if (input.checkValidity()) {
                input.classList.add("is-valid");
            } else {
                input.classList.add("is-invalid");
            }
        }

        inputs.forEach(input => {
            input.addEventListener("input", () => {
                validateInput(input);
            });
        });

        form.addEventListener("submit", event => {
            event.preventDefault();

            inputs.forEach(input => {
                validateInput(input);
            });
        });
    </script>

</body>
</html>
